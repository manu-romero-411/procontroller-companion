[general]
; Command run when the Pro Controller's capture button (BTN_Z) is pressed.
; Same syntax rules as home_launch below. If not set, defaults to
; "spectacle -m -b -n" (KDE Spectacle, current monitor, background, no
; notification, saved to Spectacle's own default screenshot folder).
;
screenshot_command = spectacle -m -b -n

; Command run when the Home button is pressed twice in quick succession.
; Passed verbatim to `bash -c "<command>"`, so quoting, spaces, pipes,
; redirects and env vars follow normal bash conventions.
;
; Example:
home_launch = notify-send "Pro Controller" 'home button double-pressed'

[hotkeys]
; Hotkeys fire while the activator chord L1 + R2 + Start is held down and
; another button is pressed. Each entry is a shell command, run with the
; same rules as the commands above. Missing or empty entries do nothing.
;
; Available keys (all buttons except Home and the activator's L1, R2, Start):
;   up_button, down_button, left_button, right_button   (D-pad)
;   a_button, b_button, x_button, y_button              (Nintendo layout)
;   r1_button, l2_button, minus_button, l3_button, r3_button
;
; A hotkey runs once per press. Holding the button for more than 1 second
; makes it repeat (every 0.2 s, at most 10 times); otherwise release and
; press again to run it again.
;
; Volume via PipeWire/WirePlumber (wpctl):
up_button = wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
down_button = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
l3_button = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
